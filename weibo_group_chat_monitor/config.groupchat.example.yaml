browser:
  user_data_dir: "../weibo_user_data/groupchat"
  browser_channel: "chrome"
  # 可选；留空时会按 browser_channel 自动查找系统 Chrome/Chromium
  executable_path: ""
  headless: false
  viewport_width: 1280
  viewport_height: 800
  initial_load_timeout_seconds: 0
  keep_open: false

chat:
  url: "https://api.weibo.com/chat/#/chat?check_gid=4761715839862414&source_from=11"
  api_url_base: "https://api.weibo.com/webim/groupchat/query_messages.json"
  group_id: "4761715839862414"
  source: "209678993"
  batch_size: 20
  history_fetch_timeout_seconds: 20
  image_response_timeout_seconds: 15
  direct_download_timeout_seconds: 15
  retry_delay_milliseconds: 5000
  history_interval_milliseconds: 1500

subscription:
  # Playwright 登录成功后写入，文件权限自动设为 0600
  cookie_cache_file: "groupchat_cookies.json"
  # 保留原始订阅事件，便于审计和排查未知事件类型
  event_log_file: "groupchat_events"
  event_log_retention_days: 7
  # Telegram 实时推送的持久化队列；失败或重启后继续发送
  notification_queue_file: "groupchat_notification_outbox.json"
  # 已处理消息/撤回事件的持久化去重状态。
  processed_state_file: "groupchat_subscription_state.json"
  # 记录已尝试过的临期 Cookie，避免每次启动都重复拉起 Playwright
  auth_refresh_state_file: "groupchat_auth_refresh_state.json"
  # Cookie 所有恢复方式均失败时的 Telegram 去重告警状态
  runtime_alert_state_file: "groupchat_runtime_alert_state.json"
  login_timeout_seconds: 180
  retry_delay_seconds: 5
  # /meta/connect 没有给出 advice.timeout 时使用的客户端兜底超时
  connect_timeout_seconds: 90
  # 每 6 小时仅用纯 Go 验证一次登录态，不启动浏览器
  auth_check_interval_hours: 6
  # ALF 距离过期 4 天时尝试一次无头 Playwright 预刷新
  proactive_refresh_before_expiry_hours: 96
  # 启动和断线重连后使用群历史接口补齐遗漏消息
  backfill_enabled: true
  backfill_max_pages: 20
  # 首次没有本地边界时只记录最新位置，不倒灌整个群历史
  backfill_on_first_start: false
  # web.im.weibo.com 的证书链在部分 Linux 环境无法验证；仅测试时开启
  tls_insecure_skip_verify: false

output:
  # 程序会在该路径所在目录下按天生成 YYYY-MM-DD.jsonl
  history_file: "clean_history"
  media_dir: "media_downloads"

state:
  state_file: "group_chat_state.json"

filters:
  target_senders:
    - "germer_123"
  # 昵称或 UID 任意一个匹配即可；UID 不受改名影响
  target_sender_uids: []

local_history_push:
  start_date: ""
  end_date: ""
  max_records: 0

stop_condition:
  enabled: true
  target_time: ""
  target_sender: "Bonoboooo"
  target_message: "内存这么快就跌了吗？我原本还在等长鑫上市集资大规模扩产卷出国际价格下跌才买几条内存呢…"

telegram:
  bot_token: "YOUR_BOT_TOKEN"
  chat_id: "-1001234567890"
  message_thread_id: 0
  direct_messages_topic_id: 0
  enabled: false
  timeout_seconds: 30
  retry_max_attempts: 3
  retry_initial_delay_seconds: 5
  proxy_url: ""

log:
  level: "error"
